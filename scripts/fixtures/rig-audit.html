<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#f4f0e7;font-family:Arial,sans-serif}section{padding:16px}h1{margin:0 0 12px;font-size:20px}main{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}article{background:#fffdf7;border-radius:18px;text-align:center;padding:8px}.avatar{height:340px;width:100%}h2{font-size:15px;margin:4px}.bone-avatar{width:100%}</style></head><body><div id="app"></div><script type="module">
import {createApp,h} from '/node_modules/.vite/deps/vue.js';
import Avatar from '/src/Avatar.vue';import{outfits,accessories,suit}from'/shared/catalog.ts';
const accessory=new URLSearchParams(location.search).get('item');const a=accessories.find(x=>x.id===accessory);
createApp({render(){return h('section',[h('h1',a?.name||'套装'),h('main',outfits.filter(o=>o.id!=='iron').map(o=>h('article',[h(Avatar,{equipment:{...suit(o.id),...(a?{[a.slot]:a.id}:{})},reduced:true}),h('h2',o.name)])))])}}).mount('#app');
</script></body></html>
