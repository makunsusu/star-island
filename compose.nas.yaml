name: star-island
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: star
      POSTGRES_DB: star_island
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
    volumes:
      - ${DATA_DIR:?Required}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U star -d star_island]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  app:
    image: star-island:${IMAGE_TAG:-latest}
    build: .
    ports: ['${APP_PORT:-18081}:3100']
    environment:
      DATABASE_URL: postgres://star:${POSTGRES_PASSWORD}@db:5432/star_island
      NODE_ENV: production
      PORT: 3100
      APP_ORIGIN: ${APP_ORIGIN:?Required}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
